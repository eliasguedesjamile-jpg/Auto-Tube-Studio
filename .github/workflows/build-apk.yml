name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 platform and build-tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK with friendly filename
        run: cp app/build/outputs/apk/debug/app-debug.apk Auto-Tube-Studio.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Tube-Studio-APK
          path: Auto-Tube-Studio.apk

      - name: Publish APK to GitHub Releases (direct mobile download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Auto Tube Studio APK
          draft: false
          prerelease: false
          files: Auto-Tube-Studio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
